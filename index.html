<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campo de cerezos</title>
<style>
:root{--ink:#4a2b3a;--glass:rgba(255,246,250,.72)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#ffe6f0;--glass:rgba(60,28,44,.6)}}
:root[data-theme="dark"]{--ink:#ffe6f0;--glass:rgba(60,28,44,.6)}
html,body{margin:0;height:100%;overflow:hidden;background:#f7d4e2;font-family:Georgia,"Times New Roman",serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 100%,rgba(255,110,170,.5),transparent 60%),radial-gradient(ellipse at 50% 0%,rgba(190,60,150,.25),transparent 50%),linear-gradient(115deg,rgba(255,170,90,.18),transparent 40%),radial-gradient(ellipse at center,transparent 45%,rgba(190,40,110,.32))}
.hint{position:fixed;left:max(14px,env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top,0px));background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 14px;border-radius:14px;max-width:min(320px,70vw);font-size:14px;line-height:1.45;transition:opacity 1.2s}
.hint b{font-size:17px;font-weight:600;display:block;margin-bottom:2px}
.hint.off{opacity:0;pointer-events:none}
.pad{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:8px}
.pad button{border:0;border-radius:50%;background:var(--glass);color:var(--ink);font-size:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pad button:active{background:#ffb0cc}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
@media (hover:none){.pad{display:grid}}
canvas{outline:none}
.snd.auto{top:calc(66px + env(safe-area-inset-top,0px));width:auto;border-radius:22px;padding:0 14px;font-family:inherit;font-size:14px}
.map{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;cursor:pointer;z-index:6;outline:none;-webkit-tap-highlight-color:transparent}
.map canvas,.map canvas:active{width:70px;height:70px;border-radius:50%;border:2px solid rgba(255,255,255,.88);box-shadow:0 3px 12px rgba(160,30,90,.35);cursor:pointer;transition:width .45s cubic-bezier(.2,.8,.2,1),height .45s cubic-bezier(.2,.8,.2,1)}
#ml{display:inline-block;margin-top:5px;padding:3px 8px;border-radius:10px;background:var(--glass);color:var(--ink);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:11px}
.map.open{right:50%;bottom:50%;transform:translate(50%,50%);animation:mapin .45s cubic-bezier(.2,.8,.2,1)}
.map.open canvas,.map.open canvas:active{width:min(88vw,62vh,460px);height:min(88vw,62vh,460px);border-width:3px;box-shadow:0 10px 40px rgba(120,20,70,.5)}
.map.open #ml{font-size:15px;padding:6px 14px;margin-top:10px}
@keyframes mapin{from{opacity:0;transform:translate(50%,50%) scale(.3)}}
.mbg{position:fixed;inset:0;background:rgba(70,20,50,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:5}
.mbg.open{opacity:1;pointer-events:auto}
.snd{position:fixed;right:max(14px,env(safe-area-inset-right));top:calc(14px + env(safe-area-inset-top,0px));width:44px;height:44px;border:0;border-radius:50%;background:var(--glass);color:var(--ink);font-size:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas><div class="vig"></div>
<div class="hint" id="hint"><b>Campo de cerezos 🌸</b>Arrastra para mirar alrededor. Camina con W A S D o las flechas; Shift para correr, E para caminar solo, Espacio para frenar. Toca el mapa pequeño para abrirlo (M). La música empieza con tu primer toque.</div>
<div class="mbg" id="mbg"></div><div class="map" id="map" role="button" tabindex="0" aria-label="Abrir mapa"><canvas id="mm" width="160" height="160"></canvas><div id="ml">🌊</div></div>
<div class="pad">
<button class="u" data-k="f" aria-label="Avanzar">▲</button>
<button class="l" data-k="l" aria-label="Izquierda">◀</button>
<button class="d" data-k="b" aria-label="Retroceder">▼</button>
<button class="r" data-k="r" aria-label="Derecha">▶</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const WX=300,WZ=400,HOR=0xff9fc7,V3=THREE.Vector3,TAU=6.2832;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
const shadows=matchMedia('(hover:hover)').matches;
if(shadows){renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;}
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(HOR,8,54);
const camera=new THREE.PerspectiveCamera(70,1,0.1,1000);
const uT={value:0};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const aniso=renderer.capabilities.getMaxAnisotropy();
function tex(c,rep){const t=new THREE.CanvasTexture(c);t.anisotropy=aniso;if(rep)t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// Cielo con sol
const SD=new V3(30,10,40).normalize();
const sky=new THREE.Mesh(new THREE.SphereGeometry(500,24,16),new THREE.ShaderMaterial({
 side:THREE.BackSide,depthWrite:false,fog:false,
 uniforms:{top:{value:new THREE.Color(0xb0509f)},hor:{value:new THREE.Color(HOR)},sd:{value:SD},t:uT},
 vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`uniform vec3 top,hor,sd;uniform float t;varying vec3 vP;
float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1.,0.)),f.x),mix(hs(i+vec2(0.,1.)),hs(i+vec2(1.,1.)),f.x),f.y);}
void main(){vec3 d=normalize(vP);vec3 c=mix(hor,top,smoothstep(0.,.75,d.y));
vec2 q=d.xz/(d.y+.25)*1.6+vec2(t*.01,0.);float cl=nz(q)*.55+nz(q*2.1)*.3+nz(q*4.3)*.15;
c=mix(c,vec3(1.,.72,.8),smoothstep(.5,.85,cl)*smoothstep(0.,.25,d.y)*.75);float hz=pow(max(dot(normalize(vec3(d.x,0.,d.z)),normalize(vec3(sd.x,0.,sd.z))),0.),3.)*(1.-smoothstep(0.,.5,d.y));c+=vec3(1.,.5,.25)*hz*.85;
float s=max(dot(d,sd),0.);c+=vec3(1.,.6,.35)*(pow(s,500.)*1.6+pow(s,30.)*.5+pow(s,4.)*.2);
gl_FragColor=vec4(min(c,vec3(1.)),1.);}`
}));
sky.renderOrder=-1;scene.add(sky);

// Luz
scene.add(new THREE.HemisphereLight(0xffa6d2,0xd27aa6,0.95));
const sun=new THREE.DirectionalLight(0xffa66e,1.25);scene.add(sun,sun.target);
if(shadows){sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);const q=sun.shadow.camera;q.left=q.bottom=-42;q.right=q.top=42;q.near=1;q.far=180;sun.shadow.bias=-.0006;sun.shadow.normalBias=.04;}

// Suelo: pasto, hojitas y pétalos caídos
const T=10,S=400;
const GS=1024,gc=mk(GS,GS),g=gc.getContext('2d');
g.fillStyle='#7aa866';g.fillRect(0,0,GS,GS);
const wr=(x,y,m,f)=>{for(const ox of[-GS,0,GS])for(const oy of[-GS,0,GS]){const X=x+ox,Y=y+oy;if(X>-m&&X<GS+m&&Y>-m&&Y<GS+m)f(X,Y);}};
for(let i=0;i<110;i++){const x=Math.random()*GS,y=Math.random()*GS,r=40+Math.random()*110,col=['70,120,62','150,190,100','110,150,70','180,185,110'][i&3];
 wr(x,y,r,(X,Y)=>{const gr=g.createRadialGradient(X,Y,0,X,Y,r);gr.addColorStop(0,'rgba('+col+',.38)');gr.addColorStop(1,'rgba('+col+',0)');g.fillStyle=gr;g.fillRect(X-r,Y-r,2*r,2*r);});}
const gg=['#3f7a3c','#4f8a48','#5f9a52','#78ad5d','#8fc268','#a4cf74','#c3de8a'];
for(let i=0;i<30000;i++){const x=Math.random()*GS,y=Math.random()*GS,a=-1.57+(Math.random()-.5)*1.3,l=6+Math.random()*12,cv=(Math.random()-.5)*5,c=gg[Math.floor(Math.random()*7)];
 wr(x,y,20,(X,Y)=>{g.strokeStyle=c;g.globalAlpha=.55+Math.random()*.4;g.lineWidth=.8+Math.random()*1.1;g.beginPath();g.moveTo(X,Y);g.quadraticCurveTo(X+Math.cos(a)*l*.5+cv,Y+Math.sin(a)*l*.5,X+Math.cos(a)*l+cv*1.5,Y+Math.sin(a)*l);g.stroke();});}
g.globalAlpha=1;
for(let i=0;i<260;i++){const x=Math.random()*GS,y=Math.random()*GS,r=2.5+Math.random()*2;wr(x,y,8,(X,Y)=>{g.fillStyle=Math.random()<.5?'#3c7a45':'#4f9250';for(let k=0;k<3;k++){g.beginPath();g.arc(X+Math.cos(k*2.09)*r,Y+Math.sin(k*2.09)*r,r,0,TAU);g.fill();}});}
for(let i=0;i<160;i++){const x=Math.random()*GS,y=Math.random()*GS,c=['#fff6d0','#ffe27a','#ffffff','#ffb8d6'][i&3];wr(x,y,6,(X,Y)=>{g.fillStyle=c;g.beginPath();g.arc(X,Y,1.6+Math.random()*1.2,0,TAU);g.fill();g.fillStyle='#e8b43c';g.fillRect(X-.4,Y-.4,.8,.8);});}
for(let i=0;i<2600;i++){const x=Math.random()*GS,y=Math.random()*GS;wr(x,y,8,(X,Y)=>{g.fillStyle=Math.random()<.6?'rgba(255,190,214,.9)':'rgba(255,240,246,.9)';g.beginPath();g.ellipse(X,Y,1.4+Math.random()*2.4,.9+Math.random()*1.3,Math.random()*3.1,0,TAU);g.fill();});}
for(let i=0;i<500;i++){g.fillStyle='rgba(80,60,40,'+(.12+Math.random()*.2)+')';g.fillRect(Math.random()*GS,Math.random()*GS,1+Math.random()*2,1+Math.random()*2);}
const gtex=tex(gc,1);gtex.repeat.set(S/T,S/T);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(S,S),new THREE.MeshLambertMaterial({map:gtex}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// Texturas: corteza y atlas flor + hoja
function petalPath(c,len,wd){c.beginPath();c.moveTo(0,0);c.bezierCurveTo(-wd,-len*.25,-wd*1.1,-len*.95,-len*.12,-len);c.lineTo(0,-len*.86);c.lineTo(len*.12,-len);c.bezierCurveTo(wd*1.1,-len*.95,wd,-len*.25,0,0);c.closePath();}
function petalFill(c,len,wd){petalPath(c,len,wd);const f=c.createLinearGradient(0,0,0,-len);f.addColorStop(0,'#e8648f');f.addColorStop(.22,'#ffd3e2');f.addColorStop(.7,'#fff4f8');f.addColorStop(1,'#ffbfd4');c.fillStyle=f;c.fill();c.strokeStyle='rgba(215,100,145,.35)';c.lineWidth=1;c.stroke();}
const ac=mk(256,128),a=ac.getContext('2d');
a.save();a.translate(64,64);
for(let k=0;k<5;k++){a.save();a.rotate(k*1.2566);petalFill(a,58,24);a.restore();}
a.fillStyle='#d63a73';a.beginPath();a.arc(0,0,4.5,0,TAU);a.fill();
for(let k=0;k<14;k++){const an=k/14*TAU,l=11+Math.random()*8;a.strokeStyle='#e0608c';a.lineWidth=1;a.beginPath();a.moveTo(0,0);a.lineTo(Math.cos(an)*l,Math.sin(an)*l);a.stroke();a.fillStyle='#8c1d4a';a.beginPath();a.arc(Math.cos(an)*l,Math.sin(an)*l,1.6,0,TAU);a.fill();}
a.restore();
a.save();a.translate(192,64);a.beginPath();a.moveTo(0,52);a.bezierCurveTo(-28,26,-26,-26,0,-60);a.bezierCurveTo(26,-26,28,26,0,52);a.closePath();
const lf=a.createLinearGradient(0,52,0,-60);lf.addColorStop(0,'#8a6538');lf.addColorStop(1,'#7f9d3c');a.fillStyle=lf;a.fill();
a.strokeStyle='#4e6325';a.lineWidth=1.5;a.beginPath();a.moveTo(0,52);a.lineTo(0,-52);a.stroke();
for(let k=-3;k<=3;k++){if(!k)continue;a.lineWidth=.8;a.beginPath();a.moveTo(0,k*-12+10);a.lineTo(Math.sign(k)*18,k*-12-6);a.stroke();}
a.restore();
const atlas=tex(ac);
const bc=mk(128,256),b=bc.getContext('2d');
b.fillStyle='#4a2f27';b.fillRect(0,0,128,256);
for(let i=0;i<260;i++){b.fillStyle='rgba('+(30+Math.random()*30)+',20,16,.5)';b.fillRect(Math.random()*128,Math.random()*256,1+Math.random()*2,10+Math.random()*50);}
for(let i=0;i<120;i++){b.fillStyle='rgba(170,135,115,.55)';b.fillRect(Math.random()*128,Math.random()*256,6+Math.random()*14,1.5);}
const barkTex=tex(bc,1);

// Variantes de árbol: tronco ramificado + copa de flores
function geom(P,N,U,I,C){const G=new THREE.BufferGeometry();G.setAttribute('position',new THREE.Float32BufferAttribute(P,3));G.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));G.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));if(C)G.setAttribute('color',new THREE.Float32BufferAttribute(C,3));G.setIndex(I);return G;}
function makeVariant(seed,ST){
 const r=mulberry(seed),P=[],N=[],U=[],I=[],tips=[];
 function branch(p,dir,len,rad,depth){
  const base=P.length/3,segs=4;let cur=p.clone(),d=dir.clone(),vl=0,mid=p.clone();
  for(let i=0;i<=segs;i++){
   const rr=rad*(1-.5*i/segs)*(depth==0&&i==0?1.3:1);
   const up=Math.abs(d.y)<.9?new V3(0,1,0):new V3(1,0,0),u=new V3().crossVectors(d,up).normalize(),w=new V3().crossVectors(d,u);
   for(let k=0;k<=6;k++){const t=k/6*TAU,n=u.clone().multiplyScalar(Math.cos(t)).addScaledVector(w,Math.sin(t)),q=cur.clone().addScaledVector(n,rr);
    P.push(q.x,q.y,q.z);N.push(n.x,n.y,n.z);U.push(k/6,vl*.5);}
   if(i==2)mid=cur.clone();if(i<segs){d.add(new V3((r()-.5)*.35,depth?-ST.g+(r()-.5)*.1:.08,(r()-.5)*.35)).normalize();cur.addScaledVector(d,len/segs);vl+=len/segs;}
  }
  for(let i=0;i<segs;i++)for(let k=0;k<6;k++){const x=base+i*7+k;I.push(x,x+7,x+1,x+1,x+7,x+8);}
  if(depth<3){const n=depth?(r()<.3?2:3):(ST.hang?5:4);for(let c=0;c<n;c++){
   const cd=d.clone().add(new V3(r()-.5,r()*.3,r()-.5).multiplyScalar((depth?1.6:2.1)*ST.sp));if(depth>=2)cd.y-=ST.dr*(.4+r()*.6);if(cd.y<ST.ymin)cd.y=ST.ymin;cd.normalize();
   branch(cur,cd,len*ST.lf*(.75+r()*.5),rad*.6,depth+1);}}
  if(depth>=1){tips.push(cur.clone());tips.push(mid.clone());}
 }
 branch(new V3(0,0,0),new V3(ST.lx||0,1,ST.lz||0).normalize(),3.2,.34,0);
 const cp=[],cn=[],cu=[],cc=[],ci=[],ctr=new V3(0,ST.cy,0);
 for(let j=0;j<110;j++){const b0=tips[Math.floor(r()*tips.length)],e=b0.clone().add(new V3(r()-.5,(r()-.25)*.8,r()-.5).multiplyScalar(ST.ex));e.y=Math.max(e.y,ST.hang?1.5:3);tips.push(e);}
 if(ST.hang)tips.slice(0,30).forEach(t=>{for(let k=1;k<=ST.hang;k++)tips.push(new V3(t.x+(r()-.5)*.4,Math.max(t.y-k*.55,.6),t.z+(r()-.5)*.4));});
 tips.forEach(t=>{for(let j=0;j<5;j++){
  const c=t.clone().add(new V3(r()-.5,r()-.5,r()-.5).multiplyScalar(1.4));
  const n=c.clone().sub(ctr).normalize().add(new V3(r()-.5,r()-.5,r()-.5).multiplyScalar(.9)).normalize();
  const up=Math.abs(n.y)<.9?new V3(0,1,0):new V3(1,0,0),u=new V3().crossVectors(n,up).normalize(),w=new V3().crossVectors(n,u);
  const an=r()*TAU,e1=u.clone().multiplyScalar(Math.cos(an)).addScaledVector(w,Math.sin(an)),e2=w.clone().multiplyScalar(Math.cos(an)).addScaledVector(u,-Math.sin(an));
  const lf0=r(),leaf=lf0<.13,bud=lf0>.9,hs=(.3+r()*.22)*(bud?.62:1),u0=leaf?.5:0,bi=cp.length/3;
  const col=leaf?[.8+r()*.2,.8+r()*.2,.75]:bud?[1,.55+r()*.15,.72]:[1,.84+r()*.16,.9+r()*.1];
  for(const[sx,sy]of[[-1,-1],[1,-1],[1,1],[-1,1]]){
   const q=c.clone().addScaledVector(e1,sx*hs).addScaledVector(e2,sy*hs*(leaf?1.3:1));
   cp.push(q.x,q.y,q.z);cn.push(n.x,n.y,n.z);cu.push(u0+(sx>0?.5:0),sy>0?1:0);cc.push(...col);}
  ci.push(bi,bi+1,bi+2,bi,bi+2,bi+3);
 }});
 return{bark:geom(P,N,U,I),canopy:geom(cp,cn,cu,ci,cc)};
}
function wind(m,amp,fl){m.onBeforeCompile=s=>{s.uniforms.uT=uT;s.vertexShader='uniform float uT;\n'+s.vertexShader.replace('#include <begin_vertex>',
 '#include <begin_vertex>\nvec4 w_=instanceMatrix*vec4(position,1.);float hh=max(position.y-1.5,0.);'+
 'transformed.x+=sin(uT*1.3+w_.x*.35+w_.z*.25)*hh*'+(amp*.05).toFixed(3)+';transformed.z+=cos(uT*1.1+w_.z*.3+w_.x*.2)*hh*'+(amp*.04).toFixed(3)+';'+
 'transformed+=vec3(sin(uT*4.+position.x*9.+position.z*5.),cos(uT*3.4+position.y*8.),sin(uT*3.7+position.z*9.))*'+fl.toFixed(3)+';');};}
const barkMat=new THREE.MeshLambertMaterial({map:barkTex,side:THREE.DoubleSide});
const canMat=new THREE.MeshLambertMaterial({map:atlas,vertexColors:true,alphaTest:.45,side:THREE.DoubleSide,emissive:0x602044});
wind(barkMat,1,0);wind(canMat,1,.018);

const STY=[
 {sp:1.8,lf:.8,g:.02,ymin:.3,dr:0,hang:0,cy:6,ex:2.6},
 {sp:1.1,lf:.82,g:0,ymin:.5,dr:0,hang:0,cy:6.6,ex:2.0,lx:.08},
 {sp:1.5,lf:.78,g:.1,ymin:-.1,dr:.4,hang:3,cy:5.6,ex:2.4},
 {sp:1.7,lf:.76,g:.03,ymin:.2,dr:.1,hang:0,cy:5.8,ex:3.0,lx:.25,lz:.1}
];
const R=8,C=8,NV=4,N=(2*R+1)**2,bark=[],can=[];
for(let v=0;v<NV;v++){
 const gv=makeVariant(11+v*7,STY[v]);
 const bm=new THREE.InstancedMesh(gv.bark,barkMat,N),cm=new THREE.InstancedMesh(gv.canopy,canMat,N);
 cm.instanceMatrix=bm.instanceMatrix;
 bm.frustumCulled=cm.frustumCulled=false;bm.castShadow=cm.castShadow=true;bm.receiveShadow=true;
 scene.add(bm,cm);bark.push(bm);can.push(cm);
}
function h(x,z,s){const n=Math.sin(x*127.1+z*311.7+s*74.7)*43758.5453;return n-Math.floor(n);}
function tree(cx,cz){return{skip:h(cx,cz,1)<.08||Math.hypot((cx+.5)*C-WX,(cz+.5)*C-WZ)<30,x:(cx+.5+(h(cx,cz,2)-.5)*.6)*C,z:(cz+.5+(h(cx,cz,3)-.5)*.6)*C,s:1.05+h(cx,cz,4)*.45};}
const d=new THREE.Object3D(),col=new THREE.Color();
let lastCx=1e9,lastCz=1e9;
function rebuild(pcx,pcz){
 const cnt=new Array(NV).fill(0);
 for(let i=-R;i<=R;i++)for(let j=-R;j<=R;j++){
  const cx=pcx+i,cz=pcz+j,t=tree(cx,cz);if(t.skip)continue;
  const v=Math.floor(h(cx,cz,8)*NV),k=cnt[v]++;
  d.position.set(t.x,0,t.z);d.rotation.set(0,h(cx,cz,6)*TAU,0);d.scale.setScalar(t.s);d.updateMatrix();
  bark[v].setMatrixAt(k,d.matrix);
